          <p><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;">按钮左到右依次是进入、编辑、删除、资源管理。</span></p><p><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'思源黑体 CN Bold', '思源黑体 CN Regular', '思源黑体 CN', sans-serif;font-weight:700;">进入</span><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;">：进入任务进行系统操作，收集的线索都可以快捷加入到任务下。</span></p><p><span style="font-family:'思源黑体 CN Bold', '思源黑体 CN Regular', '思源黑体 CN', sans-serif;font-weight:700;">编辑</span><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;">：编辑任务基本信息。</span></p><p><span style="font-family:'思源黑体 CN Bold', '思源黑体 CN Regular', '思源黑体 CN', sans-serif;font-weight:700;">删除</span><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;">：删除任务。</span></p><p><span style="font-family:'思源黑体 CN Bold', '思源黑体 CN Regular', '思源黑体 CN', sans-serif;font-weight:700;">资源管理</span><span style="font-family:'思源黑体 CN', sans-serif;font-weight:400;">：对已经收集的图片、视频、文档线索进行增删改查。</span></p>
